name: Build HDJD APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Also build a signed release APK (needs the signing secrets)"
        type: boolean
        default: false
      publish_release:
        description: "Publish the signed APK as a GitHub Release"
        type: boolean
        default: false
      fetch_logo:
        description: "Download the current logo from the website before building"
        type: boolean
        default: true

# "contents: write" is only used by the optional GitHub Release step; pull requests from forks
# always get a read-only token regardless of this setting.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LOGO_URL: https://jain.firstdj.com/image/logo.png

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Use the real logo from the website, if reachable. The repository ships a placeholder so
      # the build never depends on the network; on failure the committed logo is used.
      - name: Fetch brand logo (best effort)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.fetch_logo }}
        run: |
          python3 -m pip install --quiet pillow
          if ./tools/update_logo.sh "$LOGO_URL"; then
            echo "Using logo from $LOGO_URL"
          else
            echo "::warning::Could not fetch $LOGO_URL - building with the logo committed in the repo."
            git checkout -- app/src/main/res 2>/dev/null || true
          fi

      - name: Validate (lint + unit tests) and build debug APK
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Verify APK contents (package, permissions, launcher, TV)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$AAPT2" dump badging "$APK" > badging.txt
          cat badging.txt | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|leanback|banner"
          grep -q "name='com.firstdj.hdjd'" badging.txt
          # Only INTERNET + ACCESS_NETWORK_STATE may be requested. (AndroidX adds one internal,
          # app-private DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION; that one is expected.)
          EXTRA=$(grep "^uses-permission" badging.txt \
            | grep -v "android.permission.INTERNET" \
            | grep -v "android.permission.ACCESS_NETWORK_STATE" \
            | grep -v "com.firstdj.hdjd.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$EXTRA" ]; then echo "::error::Unexpected permissions:"; echo "$EXTRA"; exit 1; fi
          grep -q "android.permission.INTERNET" badging.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" badging.txt
          grep -q "leanback-launchable-activity" badging.txt \
            || echo "::warning::No Android TV (leanback) launcher entry found in the APK."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hdjd-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdjd-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # ------------------------------------------------------------------ release
      # Runs for version tags (v1.2.3) or when requested manually, and only if the signing
      # secrets exist. Secrets: HDJD_KEYSTORE_BASE64, HDJD_KEYSTORE_PASSWORD,
      # HDJD_KEY_ALIAS, HDJD_KEY_PASSWORD  (see README).
      - name: Check release signing secrets
        id: signing
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_build) }}
        env:
          KS: ${{ secrets.HDJD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "available=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Release signing secrets are not configured - skipping the signed release build."; fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          KS_B64: ${{ secrets.HDJD_KEYSTORE_BASE64 }}
          HDJD_KEYSTORE_PASSWORD: ${{ secrets.HDJD_KEYSTORE_PASSWORD }}
          HDJD_KEY_ALIAS: ${{ secrets.HDJD_KEY_ALIAS }}
          HDJD_KEY_PASSWORD: ${{ secrets.HDJD_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/hdjd.jks"
          export HDJD_KEYSTORE_FILE="$RUNNER_TEMP/hdjd.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/hdjd.jks"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p dist && cp "$APK" dist/HDJD-release.apk

      - name: Upload release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hdjd-release-apk
          path: dist/HDJD-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ steps.signing.outputs.available == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release create "$TAG" dist/HDJD-release.apk \
            --title "HDJD $TAG" --generate-notes --target "$GITHUB_SHA"
